l_simp_chinese:
 zz_swap_domicile_interaction:0 "交换庄园"
 zz_swap_domicile_interaction_desc:0 "与同类型住所的封臣交换附属建筑。若主建筑等级不同，先将较低的一方升至较高等级，双方保留该等级。"
 zz_swap_type_mismatch:0 "双方庄园须为同一类型。"

 zz_swap_domicile.0001.t:0 "交换庄园"
 zz_swap_domicile.0001.desc:0 "要与[recipient.GetShortUINameNoTooltip]交换双方住所的附属建筑吗？\n\n确认后，较低的主建筑先升至较高一方的等级。双方永久保留该等级，再按原等级对调外部和内部建筑。"
 zz_swap_domicile.0001.a:0 "确认交换"
 zz_swap_domicile.0001.b:0 "取消"

 zz_swap_domicile.0002.t:0 "庄园交换完成"
 zz_swap_domicile.0002.desc:0 "你与[recipient.GetShortUINameNoTooltip]交换了庄园建筑。双方建筑及等级已核对。"
 zz_swap_domicile.0002.a:0 "知道了"

 zz_swap_domicile.0003.t:0 "庄园交换已停止"
 zz_swap_domicile.0003.desc:0 "双方人物、封臣关系或所选住所已经改变。请重新选择交换对象。"
 zz_swap_domicile.0004.t:0 "庄园交换需要恢复"
 zz_swap_domicile.0004.desc:0 "部分建筑未能按预期完成交换，双方进一步交换已暂停。此次操作可能已经改变建筑，请载入交换前的存档，并在报告问题时保留异常存档。"
 zz_swap_restored.t:0 "庄园建筑已复原"
 zz_swap_restored.desc:0 "双方原有的附属建筑及其等级已复原。主建筑保留同步后的较高等级。"
 not_zz_swap_type_mismatch_third:0 "$zz_swap_type_mismatch$"
 NOT_zz_swap_type_mismatch:0 "$zz_swap_type_mismatch$"
 zz_swap_changed.t:0 "庄园情况已改变"
 zz_swap_changed.desc:0 "所选住所或双方的领属关系已经改变。请重新选择交换对象。"
 zz_swap_partial.t:0 "庄园建筑需要核对"
 zz_swap_partial.desc:0 "部分建筑未能交换，复原后仍与原有清单有差异。请载入交换前的存档以恢复原状。"
