l_simp_chinese:
 zz_md_grant_domicile_title_interaction:0 "授予住所头衔"
 zz_md_grant_domicile_title_interaction_desc:0 "将住所头衔授予这位角色。授予带来的好感与其他影响和授予头衔相同。"
 zz_md_confiscate_domicile_title_interaction:0 "抄没住所头衔"
 zz_md_confiscate_domicile_title_interaction_desc:0 "要求这位封臣交出住所头衔，承担剥夺头衔所带来的后果。封臣可能拒绝并起兵反抗；被囚禁者会接受要求。"
 zz_md_nomad_transfer_unavailable_tt:0 "游牧头衔不能转交，以免接收时合并住所。"

 zz_md_landless_title_manager_interaction:0 "无地头衔管理"
 zz_md_ltm_desc:0 "选择此人持有的头衔，标记、创建或管理无地头衔。带住所的头衔使用相应的住所操作。"
 zz_md_ltm_requirements_tt:0 "所选头衔仍须由此人持有；需要标记或地点的操作须先有有效目标。原生住所载体受保护；销毁额外住所须由你持有。"
 zz_md_ltm_mark:0 "标记所选头衔"
 zz_md_ltm_create:0 "创建无地头衔"
 zz_md_ltm_revoke:0 "剥夺所选头衔"
 zz_md_ltm_grant:0 "授予已标记头衔"
 zz_md_ltm_capital:0 "迁移已标记头衔法理首府"
 zz_md_ltm_move:0 "搬迁已标记头衔的住所"
 zz_md_ltm_dejure:0 "调整所选头衔法理"
 zz_md_ltm_destroy:0 "销毁所选头衔"
 zz_md_ltm_mark_desc:0 "将所选头衔记为后续操作的目标。"
 zz_md_ltm_create_desc:0 "选择等级，为你创建一个普通无地头衔，沿用所选头衔的纹章和颜色。"
 zz_md_ltm_revoke_desc:0 "收回所选普通头衔；带住所的头衔将打开“抄没住所头衔”的确认界面。"
 zz_md_ltm_grant_desc:0 "将你持有的已标记普通头衔交给此人；带住所的头衔将打开“授予住所头衔”的确认界面。"
 zz_md_ltm_capital_desc:0 "将已标记头衔的法理首府改为所选头衔提供的伯爵领。"
 zz_md_ltm_move_desc:0 "将已标记头衔自身的住所迁到所选地点。"
 zz_md_ltm_dejure_desc:0 "将所选头衔置于等级更高的已标记头衔之下。"
 zz_md_ltm_destroy_desc:0 "销毁所选普通头衔。你持有的本Mod额外住所将进入原有拆除确认和补偿流程；原生住所不能销毁。"
 zz_md_ltm_mark_done:0 "已标记头衔"
 zz_md_ltm_grant_done:0 "已授予头衔"
 zz_md_ltm_revoke_done:0 "已收回头衔"
 zz_md_ltm_capital_done:0 "法理首府已迁移"
 zz_md_ltm_move_done:0 "住所已迁移"
 zz_md_ltm_dejure_done:0 "法理归属已调整"
 zz_md_ltm_destroy_done:0 "头衔已销毁"
