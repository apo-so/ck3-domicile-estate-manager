 zz_md_ltm_marked_desc:0 "已标记头衔：[scope:zz_md_ltm_marked.GetName]。"
 zz_md_ltm_create_title:0 "创建无地头衔"
 zz_md_ltm_create_event_desc:0 "选择新头衔的等级。新头衔由你持有，不附带领地或住所，创建后可在头衔页改名。较高等级可能改变你的主头衔及领属关系。"
