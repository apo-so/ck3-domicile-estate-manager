l_simp_chinese:
 zz_md_provisions:0 "给养"
 zz_md_herd:0 "牧群"
 zz_md_merge_resources_decision:0 "合并辅助住所资源"
 zz_md_merge_resources_decision_desc:0 "将你其他同类型住所的给养或牧群汇集到默认住所。原有住所和建筑保留；默认住所装不下的资源仍留在原处。"
 zz_md_merge_resources_decision_tooltip:0 "查看资源合并详情。"
 zz_md_resource_notice_title:0 "住所资源合并"
 zz_md_resource_zero_desc:0 "这处住所没有可迁移的资源。"
 zz_md_resource_done_desc:0 "资源已经转移。"
 zz_md_resource_partial_desc:0 "部分资源已经转移，其余仍留在原住所。"
 zz_md_resource_capacity_desc:0 "默认住所容量不足或余额异常，资源仍留在原住所。"
 zz_md_resource_failed_desc:0 "资源转移出现异常，其余住所尚未处理，进一步合并已暂停。已发生的变化不会自动撤销；请载入合并前的存档，并保留异常存档以便报告问题。"
 zz_md_core_notice_title:0 "住所建筑调整"
 zz_md_core_done_desc:0 "主建筑已升级，附属建筑已完成交换。"
 zz_md_core_failed_desc:0 "建筑调整未能全部完成，部分主建筑升级可能已经生效。请检查两处住所；需要撤回本次变化时可载入操作前的存档。"
 zz_md_core_refused_desc:0 "主建筑无法升级至所需等级，本次未开始升级或交换。"
 zz_md_building_adjusted_title:0 "住所建筑调整"
 zz_md_building_adjusted_desc:0 "[SCOPE.sTitle('zz_md_message_building_title').GetName]已添加或升级以下建筑："
 zz_md_recover_japanese_decision:0 "调试：修复日式庄园交换"
 zz_md_recover_japanese_decision_desc:0 "仅对本模组已保存快照、同持有人且其他精确键已吻合的失败交换，按快照补齐预期建筑，不拆现有楼。补齐后仍保留资产锁；须保存并核验原生父槽、身份和资源，才能确认恢复。快照不符或陌生资产保持拒绝。"
 zz_md_attest_recovery_decision:0 "调试：确认恢复验收"
 zz_md_attest_recovery_decision_desc:0 "操作员必须先保存新的原生POST，与本次独立PRE对照双方建筑父槽、位置、持有人和资源，形成证据。此按钮只作显式验收确认；脚本会再次核验精确键。未做原生读回不得点击，未知损失不清锁。"
 zz_md_recheck_creation_decision:0 "调试：复核旧版创建"
 zz_md_recheck_creation_decision_desc:0 "仅供开发者迁移旧版测试存档。先核对创建前后的完整存档，再复核记录中的头衔、住所、建筑与资源。全部检查通过后才解除旧版创建失败状态；缺失记录或未知损失不会自动修复。"
 zz_md_recovery_pending_title:0 "建筑键已补齐，等待原生验收"
 zz_md_recovery_pending_desc:0 "建筑已匹配预期交换结果，原失败记录继续保留。请保存并检查两处住所的建筑、身份和资源，再通过确认恢复结果决议完成恢复。"
 zz_md_recovery_blocked_title:0 "恢复检查未通过"
 zz_md_recovery_blocked_desc:0 "资格、旧快照或实际资产不符合安全补齐条件。没有通用清锁或猜测回滚；保存现场并恢复本次独立PRE。"
 zz_md_recovery_done_title:0 "恢复验收已确认"
 zz_md_recovery_done_desc:0 "操作员确认原生读回完成，脚本精确键再次通过；本次资产锁和快照已清理。此确认只对应本次独立失败分支。"
 zz_md_native_readback_confirm:0 "已核对存档，开始复核"
 zz_md_created_change_desc:0 "默认住所：[ROOT.Char.MakeScope.Var('zz_md_created_old_default').Domicile.GetName] → [ROOT.Char.MakeScope.Var('zz_md_created_new_default').Domicile.GetName]；主头衔：[ROOT.Char.MakeScope.Var('zz_md_created_old_primary').Title.GetName] → [ROOT.Char.MakeScope.Var('zz_md_created_new_primary').Title.GetName]。"
 zz_md_created_change_unknown_desc:0 "此前的默认住所或主头衔未记录。请以当前显示为准。"
 zz_md_core_attachments_refused_desc:0 "附属建筑无法重建，本次未开始拆除附属建筑。已完成的主建筑升级予以保留。"
 zz_md_resource_kind_unknown_desc:0 "资源类型无法读取。"
 zz_md_resource_pair_desc:0 "来源[SCOPE.sTitle('zz_md_message_source_title').GetName] → 目标[SCOPE.sTitle('zz_md_message_target_title').GetName]。"
 zz_md_resource_titles_unknown_desc:0 "来源或目标头衔无法读取，不猜测名称。"
 zz_md_resource_numbers_desc:0 "拟转移[zz_md_message_requested|3]；目标增加[zz_md_message_received|3]；来源减少[zz_md_message_moved|3]、仍保留[zz_md_message_remaining|3]。"
 zz_md_core_pair_desc:0 "[SCOPE.sTitle('zz_md_message_core_a_title').GetName]与[SCOPE.sTitle('zz_md_message_core_b_title').GetName]。"
 zz_md_core_titles_unknown_desc:0 "一侧或两侧住所头衔无法读取。"
 zz_md_core_before_desc:0 "操作前主建筑等级：第一处[zz_md_message_core_a_before|0]，第二处[zz_md_message_core_b_before|0]。"
 zz_md_core_before_unknown_desc:0 "此前的主建筑等级无法确认。"
 zz_md_core_after_desc:0 "当前主建筑等级：第一处[zz_md_message_core_a_after|0]，第二处[zz_md_message_core_b_after|0]。"
 zz_md_core_after_unknown_desc:0 "当前主建筑等级无法确认。"
 zz_md_building_title_unknown_desc:0 "已添加或升级以下建筑："
 zz_md_creation_not_pending_tt:0 "此前没有尚待确认的辅助住所创建。"
 zz_md_legacy_title_requirement_tt:0 "失败创建时保存的返回头衔仍存在，可供复核。"
 zz_md_recovery_requirements_tt:0 "保留该次未完成交换记录；两份日式庄园快照有效、互异且仍属同一持有者；没有施工；建筑键已知；没有主建筑或资源失败。拟补的志向建筑具备合法家族解锁，其余资产符合交换快照。"
 zz_md_resource_failure_pre_desc:0 "请求[zz_md_message_requested|3]；来源原余额[zz_md_message_source_before|3]；目标原余额[zz_md_message_target_before|3]；补偿请求[zz_md_message_compensation_requested|3]。"
 zz_md_resource_failure_source_desc:0 "来源最终余额[zz_md_message_source_final|3]；来源实际净扣减[zz_md_message_actual_debit|3]。"
 zz_md_resource_failure_source_unknown_desc:0 "来源最终余额和实际扣减：未知（对象或类型无法读取）。"
 zz_md_resource_failure_target_desc:0 "目标最终余额[zz_md_message_target_final|3]；目标实际净入账[zz_md_message_actual_credit|3]。"
 zz_md_resource_failure_target_unknown_desc:0 "目标最终余额和实际入账：未知（对象或类型无法读取）。"
 zz_md_resource_failure_credit_desc:0 "补偿前目标实际入账[zz_md_message_credit_observed|3]。"
 zz_md_resource_failure_credit_unknown_desc:0 "目标入账后的余额：未知，或尚未发生入账尝试。"
 zz_md_resource_failure_net_delta_desc:0 "有符号总额差[zz_md_message_net_delta|3+]（最终总额减原总额）。"
 zz_md_resource_failure_net_delta_unknown_desc:0 "总额差：未知，尚未读到两侧最终余额。"
 zz_md_resource_failure_compensation_returned_desc:0 "目标入账后实际退回[zz_md_message_compensation_returned|3]。"
 zz_md_resource_failure_compensation_returned_unknown_desc:0 "目标实际退回：未知，缺少所需实际余额读回。"
 zz_md_resource_phase_before_credit_desc:0 "停止位置：目标入账前。"
 zz_md_resource_phase_after_credit_desc:0 "停止位置：目标入账后的检查。"
 zz_md_resource_phase_debit_attempt_desc:0 "停止位置：来源扣减阶段。"
 zz_md_resource_phase_after_debit_desc:0 "停止位置：来源扣减阶段后的检查。"
 zz_md_resource_phase_compensation_attempt_desc:0 "停止位置：目标补偿阶段。"
 zz_md_resource_phase_postcheck_desc:0 "停止位置：包含补偿尝试之后的最终余额或身份检查。"
 zz_md_resource_phase_unknown_desc:0 "异常阶段：未知。"
