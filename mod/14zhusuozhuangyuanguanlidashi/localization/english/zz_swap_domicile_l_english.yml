l_english:
 zz_swap_domicile_interaction:0 "Swap Estate"
 zz_swap_domicile_interaction_desc:0 "Exchange attachments with a vassal who has the same domicile type. If the main buildings differ in level, the lower one is upgraded to the higher level. Both keep that level."
 zz_swap_type_mismatch:0 "Both estates must be of the same type."

 zz_swap_domicile.0001.t:0 "Swap Estate"
 zz_swap_domicile.0001.desc:0 "Exchange domicile attachments with [recipient.GetShortUINameNoTooltip]?\n\nOn confirmation, the lower main building is upgraded to the higher level. Both keep that level. External and internal buildings then change sides at their existing levels."
 zz_swap_domicile.0001.a:0 "Confirm Swap"
 zz_swap_domicile.0001.b:0 "Cancel"

 zz_swap_domicile.0002.t:0 "Estate Swap Complete"
 zz_swap_domicile.0002.desc:0 "You and [recipient.GetShortUINameNoTooltip] have exchanged estate buildings. Both inventories and their levels have been checked."
 zz_swap_domicile.0002.a:0 "Done"

 zz_swap_domicile.0003.t:0 "Estate Swap Stopped"
 zz_swap_domicile.0003.desc:0 "The owners, vassal relationship, or selected domiciles have changed. Select the exchange again."
 zz_swap_domicile.0004.t:0 "Estate Swap Requires Recovery"
 zz_swap_domicile.0004.desc:0 "Some buildings could not be exchanged as intended. Further exchanges are paused for both owners. Buildings may already have changed; load a save from before the exchange and retain the affected save when reporting the problem."
 zz_swap_restored.t:0 "Estate Buildings Restored"
 zz_swap_restored.desc:0 "The original attachments and their levels have been restored on both sides. Both main buildings retain the higher level."
 not_zz_swap_type_mismatch_third:0 "$zz_swap_type_mismatch$"
 NOT_zz_swap_type_mismatch:0 "$zz_swap_type_mismatch$"
 zz_swap_changed.t:0 "The Estates Have Changed"
 zz_swap_changed.desc:0 "The selected domiciles or vassal relationship have changed. Select the exchange again."
 zz_swap_partial.t:0 "Check Your Estate Buildings"
 zz_swap_partial.desc:0 "Some buildings could not be exchanged. Restoration still differs from the original inventories. Load a save from before the exchange to return to the original state."
