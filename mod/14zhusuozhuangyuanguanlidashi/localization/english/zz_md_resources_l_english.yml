l_english:
 zz_md_provisions:0 "Provisions"
 zz_md_herd:0 "Herd"
 zz_md_merge_resources_decision:0 "Consolidate auxiliary domicile resources"
 zz_md_merge_resources_decision_desc:0 "Gather Provisions or Herd from your other domiciles of the same type into your default domicile. Existing domiciles and buildings are retained; resources that cannot be transferred remain where they are."
 zz_md_merge_resources_decision_tooltip:0 "Review the resource transfer."
 zz_md_resource_notice_title:0 "Domicile resources gathered"
 zz_md_resource_zero_desc:0 "This domicile has no resources to transfer."
 zz_md_resource_done_desc:0 "The resources have been transferred."
 zz_md_resource_partial_desc:0 "Some resources have been transferred. The rest remain in their original domicile."
 zz_md_resource_capacity_desc:0 "Your default domicile lacks capacity or has an unexpected balance. The resources remain in their original domicile."
 zz_md_resource_failed_desc:0 "The transfer encountered a problem. The remaining domiciles have not been processed, and further transfers are paused. Changes already made will not be undone automatically. Load a save from before the transfer and retain the affected save when reporting the problem."
 zz_md_core_notice_title:0 "Domicile buildings changed"
 zz_md_core_done_desc:0 "The main buildings have been upgraded and the additional buildings exchanged."
 zz_md_core_failed_desc:0 "The building changes could not be completed. Some main-building upgrades may already have taken effect. Check both domiciles, or load the preceding save to undo this attempt."
 zz_md_core_refused_desc:0 "A main building cannot be upgraded to the required level. No upgrade or exchange began."
 zz_md_building_adjusted_title:0 "Domicile building adjusted"
 zz_md_building_adjusted_desc:0 "The following building was added or upgraded in [SCOPE.sTitle('zz_md_message_building_title').GetName]:"
 zz_md_recover_japanese_decision:0 "Debug: Repair Japanese Manor exchange"
 zz_md_recover_japanese_decision_desc:0 "Only fill missing intended, expected snapshot buildings from this mod snapshot when all other exact keys match. Never remove existing buildings. Keep the asset lock until a new native POST verifies parents, identity, location and resources. Unknown assets or failed qualification remain blocked."
 zz_md_attest_recovery_decision:0 "Debug: Attest recovery checks"
 zz_md_attest_recovery_decision_desc:0 "The operator must first save native POST and compare both sides with the independent PRE: parent slots, location, holder and resources. This is explicit operator attestation, with a fresh script key check. Do not invoke without readback evidence; unknown loss remains locked."
 zz_md_recheck_creation_decision:0 "Debug: Review legacy creation"
 zz_md_recheck_creation_decision_desc:0 "For developer migration of legacy test saves. Compare complete saves from before and after creation, then review the recorded title, domicile, buildings, and resources. The legacy failure state is cleared only when all checks pass. Missing records and unknown losses are not repaired automatically."
 zz_md_recovery_pending_title:0 "Keys restored; native acceptance pending"
 zz_md_recovery_pending_desc:0 "Buildings match the expected exchange result and the original failure record is retained. Save and check both domiciles, buildings, identities and resources, then confirm recovery results."
 zz_md_recovery_blocked_title:0 "Recovery blocked"
 zz_md_recovery_blocked_desc:0 "Qualification, snapshots or assets do not meet safe missing-only recovery conditions. No generic unlock or guessed rollback. Preserve evidence and restore the independent PRE."
 zz_md_recovery_done_title:0 "Recovery acceptance attested"
 zz_md_recovery_done_desc:0 "Operator attested native readback; exact-key checks passed again. This branch lock and snapshots were cleared. This attestation applies only to the independent failed branch."
 zz_md_native_readback_confirm:0 "Saves compared; begin review"
 zz_md_created_change_desc:0 "Default domicile: [ROOT.Char.MakeScope.Var('zz_md_created_old_default').Domicile.GetName] → [ROOT.Char.MakeScope.Var('zz_md_created_new_default').Domicile.GetName]. Primary title: [ROOT.Char.MakeScope.Var('zz_md_created_old_primary').Title.GetName] → [ROOT.Char.MakeScope.Var('zz_md_created_new_primary').Title.GetName]."
 zz_md_created_change_unknown_desc:0 "The previous default domicile or primary title was not recorded. The current result is shown above."
 zz_md_core_attachments_refused_desc:0 "The additional buildings cannot be rebuilt, so none were demolished. Completed main-building upgrades have been retained."
 zz_md_resource_kind_unknown_desc:0 "Resource type unavailable."
 zz_md_resource_pair_desc:0 "Source [SCOPE.sTitle('zz_md_message_source_title').GetName] → target [SCOPE.sTitle('zz_md_message_target_title').GetName]."
 zz_md_resource_titles_unknown_desc:0 "A source or target title is unavailable; no title is guessed."
 zz_md_resource_numbers_desc:0 "Planned transfer [zz_md_message_requested|3]; target gained [zz_md_message_received|3]; source lost [zz_md_message_moved|3] and retains [zz_md_message_remaining|3]."
 zz_md_core_pair_desc:0 "[SCOPE.sTitle('zz_md_message_core_a_title').GetName] and [SCOPE.sTitle('zz_md_message_core_b_title').GetName]."
 zz_md_core_titles_unknown_desc:0 "One or both domicile titles are unavailable."
