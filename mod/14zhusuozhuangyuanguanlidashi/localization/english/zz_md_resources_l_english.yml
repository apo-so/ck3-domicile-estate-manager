 zz_md_creation_not_pending_tt:0 "No previous auxiliary-domicile creation is awaiting confirmation."
 zz_md_legacy_title_requirement_tt:0 "The stored title returned by the failed creation is still available for inspection."
 zz_md_recovery_requirements_tt:0 "The failed exchange record is retained. Both Japanese manor snapshots are valid, distinct and still owned by the same holder. No construction, unknown building keys, core or resource failure. Required house unlocks exist and other assets match the exchange snapshot."
