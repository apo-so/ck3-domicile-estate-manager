l_english:
 zz_md_grant_domicile_title_interaction:0 "Grant Domicile Title"
 zz_md_grant_domicile_title_interaction_desc:0 "Grant a domicile title to this character, with the usual effects of granting a title."
 zz_md_confiscate_domicile_title_interaction:0 "Confiscate Domicile Title"
 zz_md_confiscate_domicile_title_interaction_desc:0 "Demand a domicile title from this vassal, with the usual consequences of revocation. They may refuse and rise in rebellion; imprisoned recipients will accept."
 zz_md_nomad_transfer_unavailable_tt:0 "Nomad titles cannot be transferred, as receiving one may merge existing domiciles."

 zz_md_landless_title_manager_interaction:0 "Manage Landless Titles"
 zz_md_ltm_desc:0 "Select one of this character’s titles to mark, create, or manage titles. Titles with domiciles use the corresponding domicile actions."
 zz_md_ltm_requirements_tt:0 "The selected title must still belong to this character. Actions that need a marked title or destination require that target. Native domicile titles are protected; an extra domicile must be yours to destroy."
 zz_md_ltm_mark:0 "Mark Selected Title"
 zz_md_ltm_create:0 "Create Landless Title"
 zz_md_ltm_revoke:0 "Revoke Selected Title"
 zz_md_ltm_grant:0 "Grant Marked Title"
 zz_md_ltm_capital:0 "Move Marked Title Capital"
 zz_md_ltm_move:0 "Move Marked Title Domicile"
 zz_md_ltm_dejure:0 "Change Selected Title De Jure Liege"
 zz_md_ltm_destroy:0 "Destroy Selected Title"
 zz_md_ltm_mark_desc:0 "Remember the selected title for later actions."
 zz_md_ltm_create_desc:0 "Choose a tier and create an ordinary landless title for yourself, using the selected title’s coat of arms and color."
 zz_md_ltm_revoke_desc:0 "Take the selected ordinary title. For a domicile title, open the existing confiscation confirmation."
 zz_md_ltm_grant_desc:0 "Give this character the marked ordinary title you hold. For a domicile title, open the existing grant confirmation."
 zz_md_ltm_capital_desc:0 "Use the county provided by the selected title as the marked title’s capital."
 zz_md_ltm_move_desc:0 "Move the marked title’s own domicile to the selected destination."
 zz_md_ltm_dejure_desc:0 "Place the selected title under the marked title of a higher tier."
 zz_md_ltm_destroy_desc:0 "Destroy the selected ordinary title. Your Mod-created extra domiciles use the existing confirmation and compensation flow. Native domicile titles remain protected."
 zz_md_ltm_mark_done:0 "Title Marked"
 zz_md_ltm_grant_done:0 "Title Granted"
