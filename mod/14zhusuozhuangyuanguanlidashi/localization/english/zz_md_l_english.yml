 zz_md_created_title:0 "Domicile title created"
 zz_md_created_desc:0 "Your new domicile has been established. Your default domicile is [ROOT.Char.MakeScope.Var('zz_md_created_new_default').Domicile.GetName], and your primary title is [ROOT.Char.MakeScope.Var('zz_md_created_new_primary').Title.GetName]. Open the domicile manager to use your new residence."
