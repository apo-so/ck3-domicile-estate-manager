 zz_md_failed_title:0 "Domicile creation incomplete"
 zz_md_failed_desc:0 "The new domicile or an existing residence could not be confirmed. Further creation has been paused. Titles or buildings may already have changed; load a save from before creation and retain the affected save when reporting the problem."
 zz_md_tier_county:0 "County domicile title"
