 zz_md_swap_confirm:0 "Confirm exchange"
 zz_md_swap_done_title:0 "Domicile buildings exchanged"
 zz_md_swap_done_desc:0 "The two domiciles have exchanged their additional buildings. Both retain the higher main-building level. Their owners and locations remain unchanged."
